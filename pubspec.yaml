name: openplants
description: 🌱 Open-Source & Privacy-Friendly Companion App for your Plants
publish_to: "none"
version: 1.1.0+3

environment:
  sdk: ">=3.6.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  camera: ^0.12.0+2
  get_it: ^9.2.1
  image: ^4.5.3
  image_picker: ^1.2.0
  # ponytail: 13.x requires API 37; upgrade when the pinned Android toolchain supports it.
  permission_handler: ^12.0.3
  url_launcher: ^6.3.1
  intl: ^0.20.2
  path_provider: ^2.1.5
  flutter_onnxruntime: ^1.8.0
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.25.0
  mockito: ^5.4.4
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/ml/plant-identification/
    - assets/species/
