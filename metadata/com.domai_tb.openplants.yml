IssueTracker: https://github.com/domai-tb/OpenPlants/issues
Summary: 'Open-source & privacy-friendly companion app for your plants.'
Description: |-
  OpenPlants is an open-source, privacy-friendly plant companion app for Android.

  Track your plants, manage care routines, and never miss a watering again.

  Features:
  - Plant collection with photos and care history
  - Customizable care schedules and notifications
  - On-device plant identification using a local model
  - Dark mode and English/German localization
  - No account required and no data leaves your device

  Built with Clean Architecture. AGPL v3 licensed.

RepoType: git
Repo: https://github.com/domai-tb/OpenPlants.git

Builds:
  - versionName: '1.1.0'
    versionCode: 31
    commit: 391b3688b0e4df09a931ec692443c9ed78bba5bc
    forcevercode: true
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@3.41.4
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"

